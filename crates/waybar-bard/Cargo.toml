[package]
name = "waybar-bard"
version = "0.10.0"
edition = "2024"
description = "Waybar integration for displaying lyrics"
authors = ["wind_mask","Guilherme Puszkarek"]
license = "MIT"

[dependencies]
# Reference the shared crate
shared = { path = "../shared" }

# Waybar specific dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
signal-hook = "0.4"
mpris = "2.1.0"
zbus = "5.16.0"
compact_str = { version = "0.9.1", features = ["serde"] }
log = "0.4.34"
env_logger = "0.11.11"
